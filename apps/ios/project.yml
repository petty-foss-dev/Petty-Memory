name: EnveMemory

options:
  bundleIdPrefix: com.enve
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"

packages:
  EnveMemoryKit:
    path: Packages/EnveMemoryKit

targets:
  EnveMemory:
    type: application
    platform: iOS
    sources:
      - path: EnveMemory
        excludes:
          - Resources/Editor/**
      # The shared formatted editor, served to its web view from the bundle; build it with scripts/build-editor.sh.
      - path: EnveMemory/Resources/Editor
        type: folder
        buildPhase: resources
      - path: Shared
    dependencies:
      - package: EnveMemoryKit
      - target: EnveMemoryShare
    entitlements:
      path: EnveMemory/EnveMemory.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.enve.memory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enve.memory
        PRODUCT_NAME: EnveMemory
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: "YES"
    info:
      path: EnveMemory/Info.plist
      properties:
        CFBundleDisplayName: Petty Memory
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Petty Memory connects to the library on your computer over your home network.
        NSCameraUsageDescription: Scan the pairing QR code shown by Petty Memory on your computer.
        CFBundleURLTypes:
          - CFBundleURLName: com.enve.memory
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - enve-memory
        BGTaskSchedulerPermittedIdentifiers:
          - com.enve.memory.outbox
        UIBackgroundModes:
          - fetch

  EnveMemoryShare:
    type: app-extension
    platform: iOS
    sources:
      - path: EnveMemoryShare
      - path: Shared
    dependencies:
      - package: EnveMemoryKit
    entitlements:
      path: EnveMemoryShare/EnveMemoryShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.enve.memory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enve.memory.share
        PRODUCT_NAME: EnveMemoryShare
        APPLICATION_EXTENSION_API_ONLY: "YES"
    info:
      path: EnveMemoryShare/Info.plist
      properties:
        CFBundleDisplayName: Petty Memory
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Petty Memory connects to the library on your computer over your home network.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 1

  # Native UI regression workflows against a scratch server; they skip unless TEST_RUNNER_MEMORY_PAIRING_LINK is set.
  EnveMemoryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: EnveMemoryUITests
    dependencies:
      - target: EnveMemory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enve.memory.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: EnveMemory
        # Main-actor default isolation can't override XCTestCase's nonisolated initializers; test classes opt in instead.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  EnveMemory:
    build:
      targets:
        EnveMemory: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: EnveMemoryKit/EnveMemoryKitTests
        - EnveMemoryUITests
    profile:
      config: Release
    archive:
      config: Release
