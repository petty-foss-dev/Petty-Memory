appId: com.enve.memory
productName: Petty Memory
copyright: Copyright © 2026 Enve Media. AGPL-3.0-only.
directories:
  output: release
  buildResources: build
files:
  - package.json
  - dist/main.js
  - dist/preload.cjs
  - dist/cli.mjs
  - dist/ocr-worker.cjs
  - dist/renderer/**
  - dist/web/**
  - "!**/*.map"
  # transformers inlines onnxruntime-web for Node; only onnxruntime-node's binaries are loaded.
  - "!node_modules/onnxruntime-web/**"
  # onnxruntime-node carries binaries for every OS and CPU, and sharp's live in @img; keep only the target's.
  # Where none exists (Intel Macs) nothing is shipped: the embedding runtime is imported lazily and semantic search reports itself unavailable.
  - "!node_modules/onnxruntime-node/bin/napi-v6/!(${platform})/**"
  - "!node_modules/onnxruntime-node/bin/napi-v6/${platform}/!(${arch})/**"
  - "!node_modules/@img/sharp-*${platform}-!(${arch})/**"
extraResources:
  - from: resources/cli.mjs
    to: cli.mjs
asarUnpack:
  - dist/ocr-worker.cjs
  - node_modules/onnxruntime-node/**
  - node_modules/sharp/**
  - node_modules/@img/**
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
  - node_modules/@tesseract.js-data/eng/**
# Every native dependency ships N-API prebuilds, so there's nothing to rebuild against Electron's ABI.
npmRebuild: false
mac:
  extendInfo:
    NSMicrophoneUsageDescription: Record a meeting or lecture only when you press Record. Audio stays in your library unless you choose transcription.
  category: public.app-category.productivity
  target:
    # Separate dmgs: onnxruntime-node has no darwin-x64 binary, so the Intel build ships without it (keyword search only).
    - target: dmg
      arch: [arm64, x64]
  # Ad-hoc signature: no Apple Developer ID, but a valid seal, which Apple Silicon needs to launch the app at all.
  # For distribution, set CSC_NAME/CSC_LINK, enable hardenedRuntime and notarize.
  identity: '-'
  hardenedRuntime: false
dmg:
  title: Petty Memory
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Office
  synopsis: Shared memory for you and your AI tools
  maintainer: Enve Media
